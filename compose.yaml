services:
  barcode-label-printer:
    image: ghcr.io/statichum/barcode-label-printer:latest
    container_name: barcode-label-printer
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./spool:/app/spool
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('APP_PORT', '4050') + '/api/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
